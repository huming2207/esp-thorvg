version: "1.2.0"
description: "ThorVG is an open-source graphics library designed for creating vector-based scenes and animations"
url: https://github.com/huming2207/esp-thorvg
repository: "https://github.com/huming2207/esp-thorvg.git"
documentation: "https://github.com/thorvg/thorvg/blob/main/README.md"
issues: "https://github.com/huming2207/esp-thorvg/issues"
dependencies:
  idf: ">=5.1"
sbom:
  manifests:
    - path: sbom_thorvg.yml
      dest: thorvg
files:
  exclude:
    - "thorvg/docs/**/*"
    - "thorvg/examples/**/*"
    - "thorvg/res/**/*"
    - "thorvg/test/**/*"
    - "thorvg/web/**/*"
